name: loyalty_card_storage_app
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  # State Management
  provider: ^6.0.5
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # QR/Barcode
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5
  # Image Picker
  image_picker: ^1.0.4
  # Encryption
  encrypt: ^5.0.3
  # UI Components
  flutter_slidable: ^3.0.1
  shimmer: ^3.0.0
  # Network
  http: ^1.1.0
  connectivity_plus: ^5.0.2
  # Notifications
  flutter_local_notifications: ^16.2.0
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/ 